<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270" role="img" aria-label="Scheduled automation pulling daily reports from three registrar portals">
  <defs>
    <linearGradient id="orbBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d2231"/>
      <stop offset="100%" stop-color="#0e1117"/>
    </linearGradient>
  </defs>
  <rect width="480" height="270" fill="url(#orbBg)"/>

  <!-- three registrar portals, each behind a login -->
  <g transform="translate(34 52)">
    <g>
      <rect x="0" y="0" width="104" height="44" rx="6" fill="#10293a" stroke="#2b6e8f" stroke-width="2"/>
      <circle cx="18" cy="22" r="7" fill="none" stroke="#4fb3d9" stroke-width="2"/>
      <rect x="15" y="21" width="6" height="7" rx="1.5" fill="#4fb3d9"/>
      <rect x="34" y="14" width="52" height="6" rx="3" fill="#2b6e8f"/>
      <rect x="34" y="26" width="34" height="6" rx="3" fill="#1d4a63"/>
    </g>
    <g transform="translate(0 61)">
      <rect x="0" y="0" width="104" height="44" rx="6" fill="#10293a" stroke="#2b6e8f" stroke-width="2"/>
      <circle cx="18" cy="22" r="7" fill="none" stroke="#4fb3d9" stroke-width="2"/>
      <rect x="15" y="21" width="6" height="7" rx="1.5" fill="#4fb3d9"/>
      <rect x="34" y="14" width="44" height="6" rx="3" fill="#2b6e8f"/>
      <rect x="34" y="26" width="52" height="6" rx="3" fill="#1d4a63"/>
    </g>
    <g transform="translate(0 122)">
      <rect x="0" y="0" width="104" height="44" rx="6" fill="#10293a" stroke="#2b6e8f" stroke-width="2"/>
      <circle cx="18" cy="22" r="7" fill="none" stroke="#4fb3d9" stroke-width="2"/>
      <rect x="15" y="21" width="6" height="7" rx="1.5" fill="#4fb3d9"/>
      <rect x="34" y="14" width="56" height="6" rx="3" fill="#2b6e8f"/>
      <rect x="34" y="26" width="30" height="6" rx="3" fill="#1d4a63"/>
    </g>
  </g>

  <!-- feeds into the scheduler -->
  <g stroke="#4fb3d9" stroke-width="2.5" fill="none" stroke-linecap="round">
    <path d="M138 74 H176 Q190 74 190 96 V122"/>
    <path d="M138 135 H190"/>
    <path d="M138 196 H176 Q190 196 190 174 V148"/>
  </g>

  <!-- scheduler / headless browser worker -->
  <g transform="translate(196 100)">
    <rect x="0" y="0" width="88" height="70" rx="8" fill="#12354a" stroke="#4fb3d9" stroke-width="2.5"/>
    <circle cx="44" cy="30" r="17" fill="none" stroke="#7fd4f0" stroke-width="2.5"/>
    <path d="M44 20 V30 L51 35" stroke="#7fd4f0" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <rect x="24" y="54" width="40" height="6" rx="3" fill="#2b6e8f"/>
  </g>

  <g stroke="#4fb3d9" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M284 135 H332"/>
    <path d="M322 126 L334 135 L322 144"/>
  </g>

  <!-- the report that lands every morning -->
  <g transform="translate(342 92)">
    <rect x="0" y="0" width="94" height="86" rx="6" fill="#10293a" stroke="#2b6e8f" stroke-width="2"/>
    <g fill="#1d4a63">
      <rect x="14" y="16" width="66" height="6" rx="3"/>
      <rect x="14" y="30" width="52" height="6" rx="3"/>
      <rect x="14" y="44" width="66" height="6" rx="3"/>
      <rect x="14" y="58" width="40" height="6" rx="3"/>
    </g>
    <circle cx="74" cy="70" r="11" fill="#1a4d3a"/>
    <path d="M69 70 L73 74 L80 66" stroke="#4ade80" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="240" y="238" font-family="Arial, sans-serif" font-size="10" fill="#5f93ad" text-anchor="middle" letter-spacing="2">SCHEDULED · HEADLESS · EVERY MORNING</text>
</svg>
