<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270" role="img" aria-label="Load time roughly halved by compressing assets served through the CDN">
  <defs>
    <linearGradient id="cdnBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2b1a12"/>
      <stop offset="100%" stop-color="#0e1117"/>
    </linearGradient>
  </defs>
  <rect width="480" height="270" fill="url(#cdnBg)"/>

  <!-- before: heavy uncompressed payload, long bar -->
  <g transform="translate(46 66)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#e08b5a" letter-spacing="1">BEFORE</text>
    <rect x="0" y="12" width="300" height="26" rx="4" fill="#5c2f1e"/>
    <rect x="0" y="12" width="300" height="26" rx="4" fill="none" stroke="#e0703a" stroke-width="2"/>
    <g fill="#e0703a" opacity="0.55">
      <rect x="12" y="20" width="34" height="10" rx="2"/>
      <rect x="56" y="20" width="34" height="10" rx="2"/>
      <rect x="100" y="20" width="34" height="10" rx="2"/>
      <rect x="144" y="20" width="34" height="10" rx="2"/>
      <rect x="188" y="20" width="34" height="10" rx="2"/>
      <rect x="232" y="20" width="34" height="10" rx="2"/>
    </g>
    <text x="312" y="31" font-family="Arial, sans-serif" font-size="11" fill="#e08b5a">uncompressed</text>
  </g>

  <!-- the compression step -->
  <g transform="translate(46 128)">
    <g stroke="#e0703a" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M150 4 V26"/>
      <path d="M141 17 L150 27 L159 17"/>
    </g>
    <rect x="96" y="30" width="108" height="24" rx="12" fill="#3d2418" stroke="#e0703a" stroke-width="2"/>
    <text x="150" y="46" font-family="Arial, sans-serif" font-size="10" fill="#f0a878" text-anchor="middle" letter-spacing="1">COMPRESS</text>
  </g>

  <!-- after: same content, half the bar -->
  <g transform="translate(46 200)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#4ade80" letter-spacing="1">AFTER</text>
    <rect x="0" y="12" width="150" height="26" rx="4" fill="#12331f"/>
    <rect x="0" y="12" width="150" height="26" rx="4" fill="none" stroke="#4ade80" stroke-width="2"/>
    <g fill="#4ade80" opacity="0.55">
      <rect x="12" y="20" width="16" height="10" rx="2"/>
      <rect x="34" y="20" width="16" height="10" rx="2"/>
      <rect x="56" y="20" width="16" height="10" rx="2"/>
      <rect x="78" y="20" width="16" height="10" rx="2"/>
      <rect x="100" y="20" width="16" height="10" rx="2"/>
      <rect x="122" y="20" width="16" height="10" rx="2"/>
    </g>
    <!-- the reclaimed half -->
    <path d="M154 25 H298" stroke="#4ade80" stroke-width="1.5" stroke-dasharray="4 4" fill="none"/>
    <text x="312" y="31" font-family="Arial, sans-serif" font-size="11" fill="#7ee6a4">~2× faster</text>
  </g>
</svg>
