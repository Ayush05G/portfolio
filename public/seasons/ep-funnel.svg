<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270" role="img" aria-label="A per-user credit-card journey funnel reading correctly across four partners">
  <defs>
    <linearGradient id="fnBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b1430"/>
      <stop offset="100%" stop-color="#0e1117"/>
    </linearGradient>
  </defs>
  <rect width="480" height="270" fill="url(#fnBg)"/>

  <!-- four partner sources feeding one view -->
  <g transform="translate(30 44)">
    <g fill="#2a1f4d" stroke="#8b6ce0" stroke-width="1.8">
      <rect x="0" y="0" width="72" height="22" rx="5"/>
      <rect x="0" y="30" width="72" height="22" rx="5"/>
      <rect x="0" y="60" width="72" height="22" rx="5"/>
      <rect x="0" y="90" width="72" height="22" rx="5"/>
    </g>
    <g fill="#b9a3f0" font-family="Arial, sans-serif" font-size="9" text-anchor="middle">
      <text x="36" y="15">partner 1</text>
      <text x="36" y="45">partner 2</text>
      <text x="36" y="75">partner 3</text>
      <text x="36" y="105">partner 4</text>
    </g>
  </g>

  <g stroke="#8b6ce0" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M102 55 H130 Q146 55 146 78 V98"/>
    <path d="M102 85 H146"/>
    <path d="M102 115 H130 Q146 115 146 96 V92"/>
    <path d="M102 145 H130 Q146 145 146 110 V104"/>
  </g>

  <!-- the funnel itself: each stage reads correctly, none silently dropped -->
  <g transform="translate(176 46)">
    <g fill="#3a2a63" stroke="#a586f5" stroke-width="2">
      <rect x="24" y="0" width="212" height="26" rx="4"/>
      <rect x="46" y="34" width="168" height="26" rx="4"/>
      <rect x="68" y="68" width="124" height="26" rx="4"/>
      <rect x="90" y="102" width="80" height="26" rx="4"/>
    </g>
    <g font-family="Arial, sans-serif" font-size="9" fill="#d6c7ff" text-anchor="middle">
      <text x="130" y="17">viewed</text>
      <text x="130" y="51">applied</text>
      <text x="130" y="85">approved</text>
      <text x="130" y="119">active</text>
    </g>
  </g>

  <!-- checkmark: milestones read correctly rather than dropping -->
  <g transform="translate(404 168)">
    <circle cx="0" cy="0" r="13" fill="#1a4d3a"/>
    <path d="M-6 0 L-1 5 L7 -5" stroke="#4ade80" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="240" y="222" font-family="Arial, sans-serif" font-size="11" fill="#9d86d4" text-anchor="middle">Each partner’s milestones read correctly — none silently dropped.</text>
  <text x="240" y="246" font-family="Arial, sans-serif" font-size="10" fill="#6a5a94" text-anchor="middle" letter-spacing="2">ONE PARTNER → FOUR</text>
</svg>
