<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270" role="img" aria-label="Four landing-page themes running as tagged, comparable variants">
  <defs>
    <linearGradient id="expBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101f2e"/>
      <stop offset="100%" stop-color="#0e1117"/>
    </linearGradient>
  </defs>
  <rect width="480" height="270" fill="url(#expBg)"/>

  <!-- four variants of the same page, each tagged -->
  <g>
    <g transform="translate(34 54)">
      <rect x="0" y="0" width="90" height="112" rx="7" fill="#13293d" stroke="#4a90d9" stroke-width="2"/>
      <rect x="12" y="12" width="66" height="22" rx="3" fill="#1e4266"/>
      <rect x="12" y="42" width="50" height="5" rx="2.5" fill="#2c5a85"/>
      <rect x="12" y="53" width="62" height="5" rx="2.5" fill="#22486b"/>
      <rect x="12" y="72" width="46" height="16" rx="4" fill="#4a90d9"/>
      <circle cx="78" cy="98" r="6" fill="#1e4266"/>
      <text x="78" y="101" font-family="Arial, sans-serif" font-size="7" fill="#9fd0f5" text-anchor="middle">A</text>
    </g>
    <g transform="translate(140 54)">
      <rect x="0" y="0" width="90" height="112" rx="7" fill="#13293d" stroke="#4a90d9" stroke-width="2"/>
      <rect x="12" y="12" width="66" height="16" rx="3" fill="#1e4266"/>
      <rect x="12" y="36" width="62" height="5" rx="2.5" fill="#2c5a85"/>
      <rect x="12" y="47" width="44" height="5" rx="2.5" fill="#22486b"/>
      <rect x="12" y="66" width="58" height="16" rx="4" fill="#4a90d9"/>
      <circle cx="78" cy="98" r="6" fill="#1e4266"/>
      <text x="78" y="101" font-family="Arial, sans-serif" font-size="7" fill="#9fd0f5" text-anchor="middle">B</text>
    </g>
    <g transform="translate(246 54)">
      <rect x="0" y="0" width="90" height="112" rx="7" fill="#13293d" stroke="#4a90d9" stroke-width="2"/>
      <rect x="12" y="12" width="46" height="26" rx="3" fill="#1e4266"/>
      <rect x="12" y="46" width="66" height="5" rx="2.5" fill="#2c5a85"/>
      <rect x="12" y="57" width="38" height="5" rx="2.5" fill="#22486b"/>
      <rect x="12" y="74" width="52" height="16" rx="4" fill="#4a90d9"/>
      <circle cx="78" cy="98" r="6" fill="#1e4266"/>
      <text x="78" y="101" font-family="Arial, sans-serif" font-size="7" fill="#9fd0f5" text-anchor="middle">C</text>
    </g>
    <g transform="translate(352 54)">
      <rect x="0" y="0" width="90" height="112" rx="7" fill="#13293d" stroke="#4a90d9" stroke-width="2"/>
      <rect x="12" y="12" width="66" height="20" rx="3" fill="#1e4266"/>
      <rect x="12" y="40" width="54" height="5" rx="2.5" fill="#2c5a85"/>
      <rect x="12" y="51" width="66" height="5" rx="2.5" fill="#22486b"/>
      <rect x="12" y="70" width="48" height="16" rx="4" fill="#4a90d9"/>
      <circle cx="78" cy="98" r="6" fill="#1e4266"/>
      <text x="78" y="101" font-family="Arial, sans-serif" font-size="7" fill="#9fd0f5" text-anchor="middle">D</text>
    </g>
  </g>

  <!-- every variant reports into the same tagged event stream -->
  <g stroke="#4a90d9" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M79 172 V190 H240"/>
    <path d="M185 172 V190"/>
    <path d="M291 172 V190"/>
    <path d="M397 172 V190 H240"/>
  </g>
  <g fill="#7fc4f5">
    <circle cx="79" cy="182" r="3"/><circle cx="185" cy="182" r="3"/>
    <circle cx="291" cy="182" r="3"/><circle cx="397" cy="182" r="3"/>
  </g>
  <rect x="168" y="196" width="144" height="24" rx="12" fill="#16324a" stroke="#4a90d9" stroke-width="2"/>
  <text x="240" y="212" font-family="Arial, sans-serif" font-size="10" fill="#9fd0f5" text-anchor="middle" letter-spacing="1">TAGGED EVENTS</text>

  <text x="240" y="246" font-family="Arial, sans-serif" font-size="10" fill="#5c86a8" text-anchor="middle" letter-spacing="1">COMPARABLE, NOT MERELY LIVE</text>
</svg>
